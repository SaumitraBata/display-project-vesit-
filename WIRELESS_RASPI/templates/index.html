<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Merit List Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg shadow-sm">
                    <i class="fa-solid me-1 fa-laptop text-xl"></i>
                </div>
                <h1 class="text-xl font-semibold text-slate-900">Control Station</h1>
            </div>

            <!-- Navigation Controls (Visible only when merit-list data is loaded) -->
            <div id="nav-controls" class="hidden flex items-center space-x-2 bg-slate-100 p-1 rounded-lg border border-slate-200">
                <button id="btn-up" class="px-3 py-1.5 bg-white text-slate-600 rounded shadow-sm hover:bg-slate-50 border border-slate-200" title="Arrow Up">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
                <button id="btn-down" class="px-3 py-1.5 bg-white text-slate-600 rounded shadow-sm hover:bg-slate-50 border border-slate-200" title="Arrow Down">
                    <i class="fa-solid fa-arrow-down"></i>
                </button>
                <button id="btn-send" class="px-4 py-1.5 bg-indigo-600 text-white font-medium rounded shadow-sm hover:bg-indigo-700 transition-colors" title="Enter">
                    <i class="fa-solid fa-paper-plane mr-1"></i> Send to Displays
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full">

        <!-- Control Panel — switches which display view is being driven -->
        <div class="flex items-center space-x-2 bg-slate-100 p-1 rounded-lg border border-slate-200 w-fit mx-auto mb-8">
            <button id="tabbtn-merit" class="tab-btn px-4 py-2 text-sm font-medium rounded-md bg-indigo-600 text-white shadow-sm transition-colors" onclick="switchTab('merit')">
                <i class="fa-solid fa-list mr-1"></i> Merit List
            </button>
            <button id="tabbtn-seats" class="tab-btn px-4 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-white transition-colors" onclick="switchTab('seats')">
                <i class="fa-solid fa-chair mr-1"></i> Seats
            </button>
            <button id="tabbtn-message" class="tab-btn px-4 py-2 text-sm font-medium rounded-md text-slate-600 hover:bg-white transition-colors" onclick="switchTab('message')">
                <i class="fa-solid fa-message mr-1"></i> Message
            </button>
        </div>

        <!-- ---------- TAB: MERIT LIST ---------- -->
        <div id="tab-merit" class="tab-panel">

            <!-- Upload Dropzone -->
            <div id="upload-section" class="max-w-xl mx-auto my-12">
                <label id="dropzone" class="flex flex-col items-center justify-center w-full h-64 border-2 border-slate-300 border-dashed rounded-2xl cursor-pointer bg-white hover:bg-slate-50 border-indigo-300 hover:border-indigo-500 transition-all shadow-sm group">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4">
                        <div class="w-12 h-12 mb-3 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                        </div>
                        <p class="mb-1 text-sm font-semibold text-slate-700">Click to upload or drag and drop</p>
                    </div>
                    <input id="file-input" type="file" class="hidden" accept=".xlsx, .xls, .csv" />
                </label>
            </div>

            <!-- Data Section -->
            <div id="data-section" class="hidden space-y-6">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <div class="relative w-full sm:w-80">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" id="search-input" placeholder="Search..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    </div>
                    <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
                        <span id="row-count" class="text-sm font-medium text-slate-500">0 records found</span>
                        <button id="reset-btn" class="px-3 py-2 text-sm text-slate-600 hover:text-slate-900 border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors">
                            <i class="fa-solid fa-arrow-up-from-bracket mr-1"></i> New File
                        </button>
                    </div>
                </div>

                <!-- Tables Container -->
                <div id="tables-container" class="space-y-8 pb-12"></div>
            </div>

        </div>

        <!-- ---------- TAB: SEATS ---------- -->
        <div id="tab-seats" class="tab-panel hidden">

            <div class="max-w-3xl mx-auto">
                <p class="text-sm text-slate-500 mb-6 text-center">
                    Set the seat count for each department, then push it to every connected display.
                </p>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <label for="seat-CMPN" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">CMPN</label>
                        <input type="number" id="seat-CMPN" min="0" placeholder="0" class="w-full text-lg font-semibold px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <label for="seat-INFT" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">INFT</label>
                        <input type="number" id="seat-INFT" min="0" placeholder="0" class="w-full text-lg font-semibold px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <label for="seat-AURO" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">AURO</label>
                        <input type="number" id="seat-AURO" min="0" placeholder="0" class="w-full text-lg font-semibold px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <label for="seat-EXTC" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">EXTC</label>
                        <input type="number" id="seat-EXTC" min="0" placeholder="0" class="w-full text-lg font-semibold px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <label for="seat-AIDS" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">AIDS</label>
                        <input type="number" id="seat-AIDS" min="0" placeholder="0" class="w-full text-lg font-semibold px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <label for="seat-ECS" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">ECS</label>
                        <input type="number" id="seat-ECS" min="0" placeholder="0" class="w-full text-lg font-semibold px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    </div>
                </div>

                <button id="btn-send-seats" class="mt-6 px-4 py-2.5 bg-indigo-600 text-white font-medium rounded-lg shadow-sm hover:bg-indigo-700 transition-colors">
                    <i class="fa-solid fa-paper-plane mr-1"></i> Send to Displays
                </button>
            </div>

        </div>

        <!-- ---------- TAB: MESSAGE ---------- -->
        <div id="tab-message" class="tab-panel hidden">

            <div class="max-w-xl mx-auto">
                <p class="text-sm text-slate-500 mb-6 text-center">
                    Show a short status message on every display instead of candidate data.
                </p>

                <div class="flex flex-wrap gap-2 justify-center mb-5">
                    <button class="preset-btn px-3 py-1.5 text-sm border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors" data-text="Break">Break</button>
                    <button class="preset-btn px-3 py-1.5 text-sm border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors" data-text="Standby">Standby</button>
                    <button class="preset-btn px-3 py-1.5 text-sm border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors" data-text="Lunch">Lunch</button>
                    <button class="preset-btn px-3 py-1.5 text-sm border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors" data-text="Closed for the Day">Closed for the Day</button>
                </div>

                <input type="text" id="message-input" placeholder="Or type a custom message&hellip;" maxlength="40" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">

                <button id="btn-send-message" class="mt-4 px-4 py-2.5 bg-indigo-600 text-white font-medium rounded-lg shadow-sm hover:bg-indigo-700 transition-colors">
                    <i class="fa-solid fa-paper-plane mr-1"></i> Send to Displays
                </button>
            </div>

        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-5 right-5 bg-emerald-500 text-white px-4 py-3 rounded-lg shadow-lg transform transition-transform translate-y-20 opacity-0 z-50 flex items-center">
            <i class="fa-solid fa-circle-check mr-2"></i> Sent to Displays!
        </div>

    </main>

    <!-- Link the external JavaScript file -->
    <script src="/static/script.js"></script>
</body>
</html>
