<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAP Smart Display</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div id="setup-screen">

        <h2 style="margin-top:0;">
            ACAP Smart Display
        </h2>

        <p style="color:#94a3b8;">
            Select how this Raspberry Pi is connected
        </p>

        <div style="margin-top:25px;">

            <input
                type="text"
                id="ip-input"
                placeholder="Laptop IP"
            >

            <br>

            <button onclick="connectLaptop()">
                NORMAL Wi-Fi PI
            </button>

            <br><br>

            <button onclick="connectESP32()">
                MODIFIED PI + ESP32
            </button>

        </div>

        <p id="status"></p>

    </div>


    <div id="waiting-screen">
        WAITING FOR DATA...
    </div>


    <div id="data-screen">

        <div class="label">Candidate Name</div>
        <div class="value name-value" id="display-name">-</div>

        <div class="label">Application ID</div>
        <div class="value" id="display-id">-</div>

        <div class="label">Category / Candidature</div>
        <div class="value" id="display-category" style="margin-bottom:0;">
            -
        </div>
    </div>


    <div id="seats-screen">

        <h2 class="seats-heading">Seats Available</h2>

        <div class="seats-grid">
            <div class="seat-box">
                <div class="seat-title">CMPN</div>
                <div class="seat-count" id="seat-CMPN">&#8211;</div>
                <div class="seat-sub">seats</div>
            </div>
            <div class="seat-box">
                <div class="seat-title">INFT</div>
                <div class="seat-count" id="seat-INFT">&#8211;</div>
                <div class="seat-sub">seats</div>
            </div>
            <div class="seat-box">
                <div class="seat-title">AURO</div>
                <div class="seat-count" id="seat-AURO">&#8211;</div>
                <div class="seat-sub">seats</div>
            </div>
            <div class="seat-box">
                <div class="seat-title">EXTC</div>
                <div class="seat-count" id="seat-EXTC">&#8211;</div>
                <div class="seat-sub">seats</div>
            </div>
            <div class="seat-box">
                <div class="seat-title">AIDS</div>
                <div class="seat-count" id="seat-AIDS">&#8211;</div>
                <div class="seat-sub">seats</div>
            </div>
            <div class="seat-box">
                <div class="seat-title">ECS</div>
                <div class="seat-count" id="seat-ECS">&#8211;</div>
                <div class="seat-sub">seats</div>
            </div>
        </div>

    </div>


    <div id="message-screen">
        <div class="message-text" id="message-text">-</div>
    </div>


    <script src="backend.js"></script>
</body>
</html>
