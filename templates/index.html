<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Merit List Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg shadow-sm">
                    <i class="fa-solid me-1 fa-laptop text-xl"></i>
                </div>
                <h1 class="text-xl font-semibold text-slate-900">Control Station</h1>
            </div>
            
            <!-- Navigation Controls (Visible only when data is loaded) -->
            <div id="nav-controls" class="hidden flex items-center space-x-2 bg-slate-100 p-1 rounded-lg border border-slate-200">
                <button id="btn-up" class="px-3 py-1.5 bg-white text-slate-600 rounded shadow-sm hover:bg-slate-50 border border-slate-200" title="Arrow Up">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
                <button id="btn-down" class="px-3 py-1.5 bg-white text-slate-600 rounded shadow-sm hover:bg-slate-50 border border-slate-200" title="Arrow Down">
                    <i class="fa-solid fa-arrow-down"></i>
                </button>
                <button id="btn-send" class="px-4 py-1.5 bg-indigo-600 text-white font-medium rounded shadow-sm hover:bg-indigo-700 transition-colors" title="Enter">
                    <i class="fa-solid fa-paper-plane mr-1"></i> Send to Displays
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full">
        
        <!-- Upload Dropzone -->
        <div id="upload-section" class="max-w-xl mx-auto my-12">
            <label id="dropzone" class="flex flex-col items-center justify-center w-full h-64 border-2 border-slate-300 border-dashed rounded-2xl cursor-pointer bg-white hover:bg-slate-50 border-indigo-300 hover:border-indigo-500 transition-all shadow-sm group">
                <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4">
                    <div class="w-12 h-12 mb-3 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                    </div>
                    <p class="mb-1 text-sm font-semibold text-slate-700">Click to upload or drag and drop</p>
                </div>
                <input id="file-input" type="file" class="hidden" accept=".xlsx, .xls, .csv" />
            </label>
        </div>

        <!-- Data Section -->
        <div id="data-section" class="hidden space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="relative w-full sm:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" placeholder="Search..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                </div>
                <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
                    <span id="row-count" class="text-sm font-medium text-slate-500">0 records found</span>
                    <button id="reset-btn" class="px-3 py-2 text-sm text-slate-600 hover:text-slate-900 border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors">
                        <i class="fa-solid fa-arrow-up-from-bracket mr-1"></i> New File
                    </button>
                </div>
            </div>

            <!-- Toast Notification -->
            <div id="toast" class="fixed bottom-5 right-5 bg-emerald-500 text-white px-4 py-3 rounded-lg shadow-lg transform transition-transform translate-y-20 opacity-0 z-50 flex items-center">
                <i class="fa-solid fa-circle-check mr-2"></i> Sent to Displays!
            </div>

            <!-- Tables Container -->
            <div id="tables-container" class="space-y-8 pb-12"></div>
        </div>
    </main>

    <!-- Link the external JavaScript file -->
    <script src="/static/script.js"></script>
</body>
</html>
